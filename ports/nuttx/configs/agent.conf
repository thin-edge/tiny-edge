#
# The agent image (build.sh --agent): the agent starts instead of the
# shell, as on the other ports' single-purpose images, and the console is
# kept for set-up over USB (tedge-onboard). Without --agent, the image
# starts NSH, and the agent is the command "tiny_edge".

CONFIG_INIT_ENTRYPOINT="tiny_edge_main"
CONFIG_INIT_ENTRYNAME="tiny_edge"
# The first task gets CONFIG_INIT_STACKSIZE, not the app's STACKSIZE: the
# 2 KB default overflowed in the agent's main loop.
CONFIG_INIT_STACKSIZE=8192
CONFIG_TEDGE_PROVISIONING=y
CONFIG_SERIAL_TERMIOS=y

# What the cloud may run with c8y_Command: read-only NSH commands, as the
# ESP-IDF agent allows "free,version,uptime".
CONFIG_TEDGE_SHELL_COMMAND_ALLOW_LIST="free,uname,uptime,ps"
