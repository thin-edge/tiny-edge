#
# ESP32-S3-DevKitC: booting through MCUboot, with the same flash layout as
# the ESP32-C6 (esp32c6-devkitc.mcuboot.conf), under the S3's option names.
# It fits 4 MB of flash:
#
#   0x000000  MCUboot
#   0x020000  primary slot, the running app  1.5 MB
#   0x1A0000  secondary slot, the new app    1.5 MB
#   0x320000  scratch, for the swap          256 KB
#   0x360000  data (LittleFS, /data)         640 KB, to 0x400000

CONFIG_ESP32S3_APP_FORMAT_MCUBOOT=y
# nuttx-apps' MCUboot library, which the client's firmware update uses.
CONFIG_BOOT_MCUBOOT=y
CONFIG_ESP32S3_OTA_PRIMARY_SLOT_OFFSET=0x20000
CONFIG_ESP32S3_OTA_SECONDARY_SLOT_OFFSET=0x1A0000
CONFIG_ESP32S3_OTA_SLOT_SIZE=0x180000
CONFIG_ESP32S3_OTA_SCRATCH_OFFSET=0x320000
CONFIG_ESP32S3_OTA_SCRATCH_SIZE=0x40000
CONFIG_ESP32S3_STORAGE_MTD_OFFSET=0x360000
CONFIG_ESP32S3_STORAGE_MTD_SIZE=0xA0000
