#
# ESP32-S3 boards with octal PSRAM (the "R8" modules, such as the
# ESP32-S3-DevKitC-1 N8R8 and N16R8): the PSRAM becomes a second heap
# region. Add it with build.sh --extra configs/esp32s3-psram-octal.conf.
#
# The agent with every feature needs it: without PSRAM the S3's heap is
# about 192 KB, and the MQTT session and Wi-Fi leave no room for the second
# TLS session of a log upload or a firmware download. An image built with
# this fragment does not start on a board without PSRAM. For quad PSRAM
# (the "R2" modules), use CONFIG_ESP32S3_SPIRAM_MODE_QUAD=y instead of
# _MODE_OCT.
CONFIG_ESP32S3_SPIRAM=y
CONFIG_ESP32S3_SPIRAM_MODE_OCT=y
CONFIG_MM_REGIONS=2
