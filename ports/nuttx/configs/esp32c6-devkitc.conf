# ESP32-C6-DevKitC: settings on LittleFS, mounted at /data.
# CONFIG_ESPRESSIF_SPIFLASH_SPIFFS is not set
CONFIG_ESPRESSIF_SPIFLASH_LITTLEFS=y

# The console on the USB Serial/JTAG port, which tedge-onboard finds.
# CONFIG_ESPRESSIF_UART0 is not set
# CONFIG_UART0_SERIAL_CONSOLE is not set
CONFIG_ESPRESSIF_USBSERIAL=y

# Network buffers. The "wifi" configuration has 160 of 128 bytes (20 KB),
# which caps the TCP receive window near 17 KB: about one TLS record from
# Cumulocity at a time, so a firmware download crawled and starved the MQTT
# connection. 256-byte buffers give 40 KB, as the ESP32-S3's configuration
# has. Delayed ACKs held each window's ACK back on top of that.
CONFIG_IOB_BUFSIZE=256
# CONFIG_NET_TCP_DELAYED_ACK is not set
