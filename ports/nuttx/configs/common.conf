#
# What tiny-edge adds to a board's "wifi" configuration, on every chip.
# scripts/build.sh appends it, then the board's own file, to the board's
# configuration and lets Kconfig fill in the rest.

CONFIG_TINY_EDGE=y

# The network: DNS, the DHCP client, and NTP for the clock TLS needs.
CONFIG_NETDB_DNSCLIENT=y
CONFIG_NETUTILS_DHCPC=y
CONFIG_NETUTILS_NTPCLIENT=y
CONFIG_NET_SOCKOPTS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPv4=y

# Random numbers for TLS and the device key, from the chip's hardware RNG.
CONFIG_DEV_URANDOM=y
CONFIG_DEV_URANDOM_ARCH=y

# A restart from the cloud resets the board.
CONFIG_BOARDCTL=y
CONFIG_BOARDCTL_RESET=y

# The NTP client resolves its servers by name: 2 KB of stack is not enough.
CONFIG_NETUTILS_NTPCLIENT_STACKSIZE=4096

# Shell commands from the cloud (c8y_Command) run through popen(), which
# needs pipes. What may run is the image's allow-list (agent.conf).
CONFIG_PIPES=y
