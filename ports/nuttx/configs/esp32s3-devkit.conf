# ESP32-S3-DevKitC: settings on LittleFS, mounted at /data.
# CONFIG_ESP32S3_SPIFLASH_SPIFFS is not set
CONFIG_ESP32S3_SPIFLASH_LITTLEFS=y

# The console on the USB Serial/JTAG port, which tedge-onboard finds.
# CONFIG_ESP32S3_UART0 is not set
# CONFIG_UART0_SERIAL_CONSOLE is not set
CONFIG_ESP32S3_USBSERIAL=y
