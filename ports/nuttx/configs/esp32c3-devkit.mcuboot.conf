#
# ESP32-C3-DevKitM: booting through MCUboot, for firmware update with
# rollback, and the flash layout that goes with it. It fits 4 MB of flash, the smallest the ESP32-C6
# and ESP32-S3 DevKitC boards come with:
#
#   0x000000  MCUboot                        60 KB (0xF000)
#   0x020000  primary slot, the running app  1.5 MB
#   0x1A0000  secondary slot, the new app    1.5 MB
#   0x320000  scratch, for the swap          256 KB
#   0x360000  data (LittleFS, /data)         640 KB, to 0x400000
#
# NuttX's default slot is 1.31 MB, which the image with every feature
# (about 1.41 MB) does not fit. scripts/build.sh fails when the signed image
# is larger than a slot. The ESP32-S3 has the same layout under its own
# option names (esp32s3-devkit.mcuboot.conf).

CONFIG_ESPRESSIF_BOOTLOADER_MCUBOOT=y
# nuttx-apps' MCUboot library, which the client's firmware update uses.
CONFIG_BOOT_MCUBOOT=y
CONFIG_ESPRESSIF_OTA_PRIMARY_SLOT_OFFSET=0x20000
CONFIG_ESPRESSIF_OTA_SECONDARY_SLOT_OFFSET=0x1A0000
CONFIG_ESPRESSIF_OTA_SLOT_SIZE=0x180000
CONFIG_ESPRESSIF_OTA_SCRATCH_OFFSET=0x320000
CONFIG_ESPRESSIF_OTA_SCRATCH_SIZE=0x40000
CONFIG_ESPRESSIF_STORAGE_MTD_OFFSET=0x360000
CONFIG_ESPRESSIF_STORAGE_MTD_SIZE=0xA0000
