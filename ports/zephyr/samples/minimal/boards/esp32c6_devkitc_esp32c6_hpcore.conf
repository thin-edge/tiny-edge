# SPDX-License-Identifier: Apache-2.0
#
# ESP32-C6-DevKitC: Wi-Fi station with DHCP, and settings in NVS (the device
# key and certificate live there). The client's sizing for this board (TLS
# heap, connection counts) is ports/zephyr/profiles/boards/esp32c6-devkitc.conf,
# which sample.yaml adds after the profile.
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
