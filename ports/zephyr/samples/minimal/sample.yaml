# SPDX-License-Identifier: Apache-2.0
#
# Every client profile on every board the sample supports, so CI compiles
# each feature the profiles enable:
#
#   west twister -T ports/zephyr/samples --integration
#
# native_sim builds and runs (the console must show the version). It has no
# MCUboot and no shell, so the firmware update, coredump and shell features
# drop out there. The ESP32 builds carry every feature, with MCUboot, and add
# the board's sizing after the profile, as an application would: the
# ESP32-C6 (RISC-V, no PSRAM) and the ESP32-S3-DevKitC (Xtensa, TLS heap in
# PSRAM).
sample:
  name: tiny-edge minimal
  description: Smallest application that includes the tiny-edge client
common:
  tags: tedge
  harness: console
  harness_config:
    type: one_line
    regex:
      - "tedge-zephyr [0-9]+\\.[0-9]+\\.[0-9]+"
tests:
  sample.tedge.minimal.host.minimal:
    platform_allow: native_sim/native/64
    integration_platforms: [native_sim/native/64]
    extra_conf_files: [prj.conf, ../../profiles/minimal.conf]
  sample.tedge.minimal.host.full:
    platform_allow: native_sim/native/64
    integration_platforms: [native_sim/native/64]
    extra_conf_files: [prj.conf, ../../profiles/full.conf]
  sample.tedge.minimal.esp32c6.minimal:
    build_only: true
    platform_allow: esp32c6_devkitc/esp32c6/hpcore
    integration_platforms: [esp32c6_devkitc/esp32c6/hpcore]
    extra_conf_files:
      - prj.conf
      - ../../profiles/minimal.conf
      - ../../profiles/boards/esp32c6-devkitc.conf
  sample.tedge.minimal.esp32c6.ota:
    build_only: true
    sysbuild: true
    platform_allow: esp32c6_devkitc/esp32c6/hpcore
    integration_platforms: [esp32c6_devkitc/esp32c6/hpcore]
    extra_args: [SB_CONFIG_BOOTLOADER_MCUBOOT=y]
    extra_conf_files:
      - prj.conf
      - ../../profiles/ota.conf
      - ../../profiles/boards/esp32c6-devkitc.conf
  sample.tedge.minimal.esp32c6.full:
    build_only: true
    sysbuild: true
    platform_allow: esp32c6_devkitc/esp32c6/hpcore
    integration_platforms: [esp32c6_devkitc/esp32c6/hpcore]
    extra_args: [SB_CONFIG_BOOTLOADER_MCUBOOT=y]
    extra_conf_files:
      - prj.conf
      - ../../profiles/full.conf
      - ../../profiles/boards/esp32c6-devkitc.conf
  sample.tedge.minimal.esp32s3.minimal:
    build_only: true
    platform_allow: esp32s3_devkitc/esp32s3/procpu
    integration_platforms: [esp32s3_devkitc/esp32s3/procpu]
    extra_conf_files:
      - prj.conf
      - ../../profiles/minimal.conf
      - ../../profiles/boards/esp32s3-devkitc.conf
  sample.tedge.minimal.esp32s3.ota:
    build_only: true
    sysbuild: true
    platform_allow: esp32s3_devkitc/esp32s3/procpu
    integration_platforms: [esp32s3_devkitc/esp32s3/procpu]
    extra_args: [SB_CONFIG_BOOTLOADER_MCUBOOT=y]
    extra_conf_files:
      - prj.conf
      - ../../profiles/ota.conf
      - ../../profiles/boards/esp32s3-devkitc.conf
  sample.tedge.minimal.esp32s3.full:
    build_only: true
    sysbuild: true
    platform_allow: esp32s3_devkitc/esp32s3/procpu
    integration_platforms: [esp32s3_devkitc/esp32s3/procpu]
    extra_args: [SB_CONFIG_BOOTLOADER_MCUBOOT=y]
    extra_conf_files:
      - prj.conf
      - ../../profiles/full.conf
      - ../../profiles/boards/esp32s3-devkitc.conf
  sample.tedge.minimal.esp32s3.onboarding:
    build_only: true
    platform_allow: esp32s3_devkitc/esp32s3/procpu
    integration_platforms: [esp32s3_devkitc/esp32s3/procpu]
    extra_conf_files:
      - prj.conf
      - ../../profiles/minimal.conf
      - ../../profiles/boards/esp32s3-devkitc.conf
      - overlay-onboarding.conf
  sample.tedge.minimal.esp32c6.onboarding:
    build_only: true
    platform_allow: esp32c6_devkitc/esp32c6/hpcore
    integration_platforms: [esp32c6_devkitc/esp32c6/hpcore]
    extra_conf_files:
      - prj.conf
      - ../../profiles/minimal.conf
      - ../../profiles/boards/esp32c6-devkitc.conf
      - overlay-onboarding.conf
