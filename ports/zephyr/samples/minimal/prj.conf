# SPDX-License-Identifier: Apache-2.0
#
# The smallest application that hosts the client. Build it with one of the
# client's profiles, which picks the features and sets the mbedTLS options
# the Cumulocity transport needs:
#
#   west build -b <board> ports/zephyr/samples/minimal -- \
#     -DEXTRA_CONF_FILE=$PWD/ports/zephyr/profiles/minimal.conf
#
# boards/<board>.conf adds the board's network and settings storage;
# sample.yaml lists every profile and board CI builds.

CONFIG_TEDGE=y
CONFIG_LOG=y
