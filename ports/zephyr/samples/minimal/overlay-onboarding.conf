# SPDX-License-Identifier: Apache-2.0
#
# Set the device up with a tool over the console (tedge-onboard): the
# provisioning library speaks Improv Serial after "tedge improv", the
# sample joins and stores the Wi-Fi network it is given, and the client
# enrolls with the tenant and one-time password it is given. Nothing
# about the network or the tenant is built in.
#
#   west build -b esp32s3_devkitc/esp32s3/procpu ports/zephyr/samples/minimal -- \
#     -DEXTRA_CONF_FILE="$PWD/ports/zephyr/profiles/minimal.conf;\
#   $PWD/ports/zephyr/profiles/boards/esp32s3-devkitc.conf;\
#   $PWD/ports/zephyr/samples/minimal/overlay-onboarding.conf"

CONFIG_TEDGE_PROVISIONING=y

CONFIG_SHELL=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
