# SPDX-License-Identifier: Apache-2.0
#
# The POSIX port: built with every compiler and C library it supports, its
# tests run, and the options that switch features off built too.
name: posix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, GCC
            os: ubuntu-latest
            cc: gcc
          - name: Linux, Clang
            os: ubuntu-latest
            cc: clang
          - name: macOS, Clang
            os: macos-latest
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Every feature the port has, and the provisioning library
        run: |
          cmake -S ports/posix -B build -DTEDGE_WERROR=ON -DTEDGE_PROVISIONING=ON
          cmake --build build -j4
          ctest --test-dir build --output-on-failure

      # The features off, and the other authentication: what the core
      # leaves out (tedge_absent.c) must still link.
      - name: Bootstrap authentication, telemetry only
        run: |
          cmake -S ports/posix -B build-small -DTEDGE_WERROR=ON \
            -DTEDGE_AUTH=bootstrap -DTEDGE_C8Y_MQTT=core \
            -DTEDGE_HEALTH=OFF -DTEDGE_RESTART=OFF -DTEDGE_LOG_UPLOAD=OFF \
            -DTEDGE_PARAMETERS=OFF -DTEDGE_CERT_RENEWAL=OFF \
            -DTEDGE_REMOTE_ACCESS=OFF -DTEDGE_C8Y_OPERATION_JSON=OFF \
            -DFETCHCONTENT_BASE_DIR=$PWD/build/_deps
          cmake --build build-small -j4
          ctest --test-dir build-small --output-on-failure

      # The options for POSIX systems that are RTOSes (NuttX), and the
      # features only they turn on by default: the shell command through
      # popen() and the clock from SNTP. macOS has no SIOCGIFHWADDR, so the
      # MAC option is built on Linux only.
      - name: RTOS options, shell command, SNTP
        run: |
          cmake -S ports/posix -B build-rtos -DTEDGE_WERROR=ON \
            -DTEDGE_POSIX_THREAD_STACKS=ON \
            -DTEDGE_POSIX_MAC_IOCTL=${{ runner.os == 'Linux' && 'ON' || 'OFF' }} \
            -DTEDGE_POSIX_NO_EXEC=ON -DTEDGE_SNTP=ON \
            -DTEDGE_SHELL_COMMAND=ON -DTEDGE_SHELL_COMMAND_ALLOW_LIST="uname,echo" \
            -DFETCHCONTENT_BASE_DIR=$PWD/build/_deps
          cmake --build build-rtos -j4
          ctest --test-dir build-rtos --output-on-failure
