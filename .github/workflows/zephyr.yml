# SPDX-License-Identifier: Apache-2.0
#
# Checks for the Zephyr port and for the core/port boundary.
name: zephyr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundaries:
    name: Core is portable, ports are independent, no secrets logged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-portability.py
      - run: python3 scripts/check-secrets.py

  build:
    name: Samples, unit tests and Kconfig rules
    runs-on: ubuntu-latest
    container:
      image: zephyrprojectrtos/zephyr-build:latest
      options: --user root
    env:
      # The image registers the SDK in the *non-root* user's CMake package
      # registry (~/.cmake/packages/Zephyr-sdk), and this job runs as root,
      # so find_package(Zephyr-sdk) comes up empty: "Could not find a
      # package configuration file provided by Zephyr-sdk". Pointing at the
      # directory that holds zephyr-sdk-<version> lets CMake find it
      # whatever version :latest happens to carry.
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains
    steps:
      - uses: actions/checkout@v4
        with:
          path: tiny-edge
      - name: Set up the Zephyr workspace
        run: |
          west init -l --mf ports/zephyr/west.yml tiny-edge
          west update --narrow -o=--depth=1
          west zephyr-export
          # The ESP32-C6 builds need Espressif's Wi-Fi blobs, mbedTLS its
          # PSA-crypto submodule, and the MCUboot builds imgtool's packages.
          west blobs fetch hal_espressif
          (cd modules/crypto/mbedtls && git submodule update --init --recursive --depth=1)
          pip3 install -r bootloader/mcuboot/scripts/requirements.txt
      # Every sample build (each profile on native_sim and the ESP32-C6, see
      # ports/zephyr/samples/minimal/sample.yaml) and the unit tests, with
      # warnings as errors. The native_sim builds also run.
      - name: Samples and unit tests (twister)
        working-directory: tiny-edge
        run: |
          west twister -T ports/zephyr/samples -T ports/zephyr/tests/unit \
            --integration --inline-logs -O ../twister-out
      - name: Kconfig dependency rules
        working-directory: tiny-edge
        run: bash ports/zephyr/tests/kconfig/check-kconfig.sh ../build-kconfig
      # Every core file compiled with the host's compiler and C library and
      # no RTOS at all: what the portability check's patterns cannot see.
      # mbedTLS 4 keeps half its headers in tf-psa-crypto.
      - name: The core without an RTOS
        working-directory: tiny-edge
        run: |
          m=../modules/crypto
          CC=gcc tests/host-compile/run.sh $m/mbedtls/include \
            $m/tf-psa-crypto/include $m/tf-psa-crypto/drivers/builtin/include
      - name: Twister results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: |
            twister-out/twister.json
            twister-out/**/build.log
          if-no-files-found: ignore
