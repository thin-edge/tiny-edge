# SPDX-License-Identifier: Apache-2.0
#
# What a Cumulocity tenant needs for tiny-edge devices, as a c8y-tenant-sync
# manifest (https://github.com/reubenmiller/c8y-tenant-sync): the DTM
# parameter sets and the Smart Functions. Each release carries it as a
# bundle, tiny-edge-tenant-sync_<version>.tar.gz, with the files it uses.
# The tenant features it needs (mqtt-service.smartrest,
# certificate-authority) are left to the tenant's own manifest; see
# cumulocity/README.md.

digitalTwin:
  propertyDefinitions:
    - source:
        path: ./dtm

smartFunctions:
  - source:
      path: ./smart-functions
