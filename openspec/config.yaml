schema: spec-driven

context: |
  Domain: tiny-edge, a thin-edge.io device-management client for
  microcontrollers (public API `tedge_*`). Any user's firmware can include
  it. It connects directly to Cumulocity first (MQTT Service :9883,
  SmartREST 2.0; onboarding via the Cumulocity CA); remote access,
  including forwarding to other LAN hosts, is the headline feature. The
  thin-edge.io gateway transport comes later. Every feature is selected at
  build time so constrained boards include only what fits; see the
  device-management-features and tedge-client-module specs.

  The client was developed as tedge-zephyr inside
  thin-edge/microcontroller-devices, which is now an example of
  applications built with it.

  Layout: `core/` is portable C with no RTOS API; `ports/<rtos>/` adapts it
  to one RTOS following that RTOS's own conventions (Zephyr first; FreeRTOS,
  Eclipse ThreadX, and POSIX for QNX and VxWorks planned). The port
  interface is at the transport level: ports provide a TLS byte stream,
  threads, storage, crypto, and firmware slots; the core owns the protocols.

  Design priorities (in order):
    1. Fit constrained MCU resources (flash, RAM, no/limited filesystem).
    2. One implementation of the client across RTOSes; ports stay thin.
    3. Each port feels native to its RTOS (packaging, configuration,
       logging, storage).

rules:
  proposal:
    - Include a "Non-goals" section.
    - List the build options the change adds, and their measured flash/RAM
      cost per target board.
    - State any change to the public `tedge_*` API, the port interface, or
      the messages the device sends.
    - Say whether the change is in core/, a port, or both. New RTOS calls go
      in a port, never in core/.
  tasks:
    - Break tasks into chunks of at most ~2 hours.
    - Keep core/ changes and port changes in separate tasks.
